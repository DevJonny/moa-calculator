<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171a">
  <meta name="description" content="Work out how far each scope click moves your point of impact at any distance.">
  <title>MOA Calculator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>MOA Calculator</h1>

    <section class="field">
      <h2 id="click-label">Scope click value</h2>
      <div class="segmented" role="radiogroup" aria-labelledby="click-label" id="click">
        <button type="button" role="radio" data-value="0.125">⅛ MOA</button>
        <button type="button" role="radio" data-value="0.25">¼ MOA</button>
        <button type="button" role="radio" data-value="0.5">½ MOA</button>
        <button type="button" role="radio" data-value="1">1 MOA</button>
      </div>
    </section>

    <section class="field">
      <h2><label for="distance">Distance</label></h2>
      <div class="input-row">
        <input id="distance" type="number" inputmode="decimal" min="0" step="any">
        <div class="segmented compact" role="radiogroup" aria-label="Distance unit" id="unit">
          <button type="button" role="radio" data-value="yd">yd</button>
          <button type="button" role="radio" data-value="m">m</button>
        </div>
      </div>
      <div class="presets" id="presets">
        <button type="button" data-value="25">25</button>
        <button type="button" data-value="50">50</button>
        <button type="button" data-value="100">100</button>
        <button type="button" data-value="200">200</button>
        <button type="button" data-value="300">300</button>
      </div>
    </section>

    <section class="result" aria-live="polite">
      <p class="caption">Each click moves impact</p>
      <p class="big"><span id="click-primary">–</span></p>
      <p class="secondary" id="click-secondary"></p>
      <p class="secondary" id="one-moa"></p>
    </section>

    <section class="field">
      <h2><label for="offset">Clicks to move</label></h2>
      <div class="input-row">
        <input id="offset" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        <span class="suffix" id="offset-unit">in</span>
      </div>
      <p class="clicks" id="clicks"></p>
    </section>

    <footer>Uses true MOA: 1.047″ at 100 yd. Many scopes round this to 1″.</footer>
  </main>
</body>
</html>
